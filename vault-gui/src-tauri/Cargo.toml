[package]
name = "vault-gui"
version = "0.1.0"
description = "GUI for password manager vault"
authors = ["Password Manager Team"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
vault-core = { path = "../../vault-core" }
tauri = { version = "1.5", features = [ "clipboard-write-text", "dialog-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

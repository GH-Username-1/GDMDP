[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security & Error Handling
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4"
